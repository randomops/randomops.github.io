<header class="site-header">
  <div class="container header-container">
    <a class="brand-link" href="{{ site.baseurl }}/" aria-label="randomOps Home">
      <div class="brand-logo-icon" aria-hidden="true">
        <!-- Terminal & Waveform SVG Icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">random<span>Ops</span></div>
        <span class="brand-tag">Podcast & Community</span>
      </div>
    </a>

    <nav class="nav-container" aria-label="Main Navigation">
      <ul class="nav-menu" id="nav-menu">
        <li>
          <a class="nav-link {% if page.url == '/' or page.layout == 'post' %}active{% endif %}" href="{{ site.baseurl }}/">Episodes</a>
        </li>
        <li>
          <a class="nav-link {% if page.url contains 'about' %}active{% endif %}" href="{{ site.baseurl }}/about">About</a>
        </li>
      </ul>
    </nav>

    <div class="header-actions">
      <!-- RSS Feed Icon Link -->
      <a href="{{ site.baseurl }}/feed.xml" class="theme-toggle-btn" title="RSS Feed" aria-label="RSS Feed">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11a9 9 0 0 1 9 9"></path>
          <path d="M4 4a16 16 0 0 1 16 16"></path>
          <circle cx="5" cy="19" r="1"></circle>
        </svg>
      </a>

      <!-- Dark / Light Theme Toggle Button -->
      <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
        <!-- Sun Icon (shown in dark mode) -->
        <svg class="sun-icon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg class="moon-icon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
